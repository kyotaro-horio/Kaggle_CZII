local_kaggle_dataset_dir: /media/kyotaro/ubuntu_volume_1/Dataset/kaggle/czii-cryo-et-object-identification
exp_name: code-test

# --- train ---
mode: local
seed: 1234
patch_size: [48, 196, 196]
batch_size: 4
lr: 1e-3
epochs: 300
val_interval: 1
radius_factor: 0.5

# --- test ---
do_cv: True
model_folder: code_test
do_thresh_optimization: False
prob_thresh: [0.5, 0.75, 0.95, 0.95, 0.95, 0.95, 0.9]
blob_thresh: 25
tta: False
tta_k_rotate: 3
overlap: [1, 1, 1]
